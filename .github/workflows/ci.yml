name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      # 第三方 action 鎖 full SHA（v4），防 tag 被移動的供應鏈風險
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # dotnet test 會一併建置 app 專案參考，毋須獨立 build step
      - name: Test
        run: dotnet test tests/DockerDashboard.Tests -v minimal
