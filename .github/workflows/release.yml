name: Release

on:
  push:
    branches: [main]

# 兩次 merge 並發時排隊執行，避免版號互踩
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 計算版號
        id: ver
        shell: pwsh
        run: |
          $headSubject = git log -1 --format=%s
          if ($headSubject -match '\[skip release\]') {
            Write-Host "commit 標記 [skip release]，跳過發佈"
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $lastTag = git describe --tags --abbrev=0 --match "v*" 2>$null
          if (-not $lastTag) { $lastTag = "v0.0.0" }

          $tagCommit = if ($lastTag -ne "v0.0.0") { git rev-list -n 1 $lastTag } else { "" }
          if ($tagCommit -eq (git rev-parse HEAD)) {
            Write-Host "HEAD 已是 $lastTag，無新 commit，跳過發佈"
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # feat → minor、其餘（fix/chore/docs...）→ patch
          $ver = [version]($lastTag.TrimStart('v'))
          $range = if ($lastTag -ne "v0.0.0") { "$lastTag..HEAD" } else { "HEAD" }
          $subjects = @(git log $range --format=%s)
          $hasFeat = $subjects | Where-Object { $_ -match '^feat(\(|!|:)' }
          $next = if ($hasFeat) {
            "{0}.{1}.0" -f $ver.Major, ($ver.Minor + 1)
          } else {
            "{0}.{1}.{2}" -f $ver.Major, $ver.Minor, ($ver.Build + 1)
          }

          Write-Host "上個 tag：$lastTag → 新版：$next（feat=$([bool]$hasFeat)）"
          "skip=false" >> $env:GITHUB_OUTPUT
          "version=$next" >> $env:GITHUB_OUTPUT
          "lasttag=$lastTag" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: steps.ver.outputs.skip == 'false'
        run: dotnet test tests/DockerDashboard.Tests -v minimal

      - name: Publish
        if: steps.ver.outputs.skip == 'false'
        run: dotnet publish src/DockerDashboard -c Release -r win-x64 --self-contained false -o publish "-p:Version=${{ steps.ver.outputs.version }}"

      - name: 安裝 vpk
        if: steps.ver.outputs.skip == 'false'
        run: dotnet tool install -g vpk

      # 抓前版產 delta 更新包；首次或抓失敗只影響 delta，不擋發佈
      - name: 下載前版
        if: steps.ver.outputs.skip == 'false'
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --channel win --token ${{ github.token }}

      # 參數對齊 scripts/release.ps1，與既有安裝版更新鏈相容
      - name: vpk pack
        if: steps.ver.outputs.skip == 'false'
        run: vpk pack --packId DockerDashboard --packVersion ${{ steps.ver.outputs.version }} --packDir publish --mainExe DockerDashboard.exe --channel win

      - name: 建立 GitHub Release
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $lastTag = "${{ steps.ver.outputs.lasttag }}"
          $range = if ($lastTag -ne "v0.0.0") { "$lastTag..HEAD" } else { "HEAD" }
          $notes = (@(git log $range --format='- %s') -join "`n")
          if (-not $notes) { $notes = "Version $ver" }
          $files = Get-ChildItem Releases | Select-Object -ExpandProperty FullName
          gh release create "v$ver" @files --title "v$ver" --notes $notes
